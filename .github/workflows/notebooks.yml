name: Notebooks
on:
  pull_request:
    paths: ['notebooks/**','scripts/validate_notebooks.py']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv sync --group dev
      - run: uv run python scripts/validate_notebooks.py
