name: Release artifact (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.0'
      - run: uv sync --group dev
      - run: uv build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
