# Conservative starting point for a single 6 GiB GPU. Adjust before starting a run.
runtime:
  device: cuda:0
  precision: fp16
  require_gpu: true
  seed: 42
training:
  epochs: 2
  batch_size: 4
  accumulation: 8
  learning_rate: 0.00002
  gradient_checkpointing: true
  save_steps: 100
retrieval:
  candidate_top_k: 100
  embedding_batch_size: 16
  reranker_batch_size: 8
  similarity_query_batch_size: 4
  similarity_doc_chunk_size: 2048
  max_val_queries: 100
  max_test_queries: 0
