[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "domain-adaptive-retrieval"
version = "0.1.0"
description = "Domain-adaptive embedding and reranker training with honest retrieval evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
keywords = ["retrieval", "embedding", "reranker", "sentence-transformers", "BEIR"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26,<3", "pydantic>=2,<3", "PyYAML>=6,<7", "typer>=0.15,<1"]

[project.optional-dependencies]
train = [
  "torch>=2.3,<3", "sentence-transformers>=5.1,<6",
  "datasets>=3,<6", "accelerate>=1,<2", "transformers>=4.56,<6",
  "huggingface-hub>=0.34,<2",
]
benchmark = ["pandas>=2,<4", "pyarrow>=17", "requests>=2,<3"]
publish = ["huggingface-hub>=0.34,<2"]

[dependency-groups]
dev = [
  "pytest>=8,<10", "pytest-cov>=5,<8", "mypy>=1.15,<2",
  "ruff>=0.9,<1", "pre-commit>=4,<5", "types-PyYAML>=6",
  "nbformat>=5,<6", "nbclient>=0.10,<1", "build>=1,<2", "twine>=6,<8",
  "pandas>=2,<4", "torch>=2.3,<3",
]

[project.scripts]
dar = "domain_adaptive_retrieval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_adaptive_retrieval"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["PLAN.md", "notebooks", "data", "outputs"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4"]
[tool.ruff.lint.isort]
known-first-party = ["domain_adaptive_retrieval"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]
"src/domain_adaptive_retrieval/cli.py" = ["B008"]
"src/domain_adaptive_retrieval/evaluation/spans.py" = ["C416"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/domain_adaptive_retrieval"]
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: requires physical NVIDIA GPU", "network: downloads remote models or data", "slow: long integration tests"]

[tool.coverage.run]
source = ["domain_adaptive_retrieval"]
[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "pragma: no cover"]
